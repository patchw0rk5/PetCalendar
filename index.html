<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Calendar</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #777777;
    --border: #e5dfd5;
    --accent: #2f7d6d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }

  /* Add-event form */
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  label { display: flex; flex-direction: column; font-size: 0.8rem; color: var(--muted); gap: 4px; }
  input, select, button {
    font: inherit;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); align-self: end; }

  /* Calendar header */
  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .nav h2 { margin: 0; flex: 1; text-align: center; font-size: 1.2rem; }

  /* Calendar grid */
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekdays div { text-align: center; font-size: 0.75rem; color: var(--muted); padding: 4px 0; }
  .cell {
    min-height: 76px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    background: #fff;
    cursor: pointer;
    overflow: hidden;
  }
  .cell.empty { background: transparent; border: none; cursor: default; }
  .cell.today { border: 2px solid var(--accent); }
  .cell .num { font-size: 0.8rem; color: var(--muted); }
  .chip {
    display: block;
    margin-top: 2px;
    padding: 1px 4px;
    border-radius: 4px;
    font-size: 0.68rem;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Legend and list */
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.8rem; margin-top: 12px; }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--c);
    margin-right: 5px;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.9rem; }
  li:first-child { border-top: none; }
  li .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  li .text { flex: 1; }
  li .notes { color: var(--muted); font-size: 0.8rem; }
  li button { padding: 4px 8px; font-size: 0.75rem; }
  .hint { color: var(--muted); font-size: 0.8rem; margin: 8px 0 0; }

  @media (max-width: 520px) {
    .cell { min-height: 58px; }
    .chip { font-size: 0.6rem; }
  }
</style>
</head>
<body>
<main>
  <h1>🐾 Pet Calendar</h1>

  <section class="card">
    <h2>Add an event</h2>
    <form id="eventForm">
      <label>Pet's name
        <input id="pet" required maxlength="30" placeholder="e.g. Mochi">
      </label>
      <label>Event type
        <select id="type"></select>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label>Notes (optional)
        <input id="notes" maxlength="80" placeholder="e.g. Dr Tan, 3pm">
      </label>
      <button class="primary" type="submit">Add event</button>
    </form>
    <p class="hint">Birthdays and adoption days repeat every year automatically. Tap a day in the calendar to fill in its date.</p>
  </section>

  <section class="card">
    <div class="nav">
      <button id="prev" aria-label="Previous month">&larr;</button>
      <h2 id="monthLabel"></h2>
      <button id="today">Today</button>
      <button id="next" aria-label="Next month">&rarr;</button>
    </div>
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card">
    <h2>This month's events</h2>
    <ul id="monthList"></ul>
  </section>
</main>

<script>
  // 1. The kinds of events, with their colours.
  //    "yearly: true" means the event repeats every year on the same date.
  const TYPES = {
    birthday:    { label: "Birthday",     color: "#d6336c", yearly: true },
    adoption:    { label: "Adoption day", color: "#7048e8", yearly: true },
    vet:         { label: "Vet visit",    color: "#1c7ed6", yearly: false },
    vaccination: { label: "Vaccination",  color: "#2f9e44", yearly: false },
    medication:  { label: "Medication",   color: "#e8590c", yearly: false },
    grooming:    { label: "Grooming",     color: "#0c8599", yearly: false }
  };

  // 2. Saving and loading. Events live in your browser (localStorage).
  const STORAGE_KEY = "petcalendar.events";

  function loadEvents() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveEvents() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    } catch (e) {
      alert("Couldn't save in this browser, so events will be lost when you close the page.");
    }
  }

  let events = loadEvents();
  let viewDate = new Date();
  viewDate.setDate(1); // always the 1st of the month being shown

  // 3. Handy references to parts of the page.
  const grid = document.getElementById("grid");
  const monthLabel = document.getElementById("monthLabel");
  const monthList = document.getElementById("monthList");
  const typeSelect = document.getElementById("type");
  const dateInput = document.getElementById("date");

  // 4. Dates are stored as text like "2026-11-18".
  function dateString(year, month, day) {
    return year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
  }

  function todayString() {
    const t = new Date();
    return dateString(t.getFullYear(), t.getMonth(), t.getDate());
  }

  // Does this event fall on this day? (Yearly events match on month and day only.)
  function eventOnDay(ev, ds) {
    if (ev.date === ds) return true;
    return TYPES[ev.type].yearly && ev.date.slice(5) === ds.slice(5);
  }

  // 5. Draw the calendar.
  function render() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = todayString();

    monthLabel.textContent = viewDate.toLocaleString("en-SG", { month: "long", year: "numeric" });
    grid.innerHTML = "";
    monthList.innerHTML = "";

    // Blank cells before the 1st
    for (let i = 0; i < firstWeekday; i++) {
      const blank = document.createElement("div");
      blank.className = "cell empty";
      grid.appendChild(blank);
    }

    const monthEvents = [];

    for (let day = 1; day <= daysInMonth; day++) {
      const ds = dateString(year, month, day);
      const cell = document.createElement("div");
      cell.className = "cell" + (ds === today ? " today" : "");

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = day;
      cell.appendChild(num);

      events.filter(ev => eventOnDay(ev, ds)).forEach(ev => {
        const type = TYPES[ev.type];
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.style.background = type.color;
        chip.textContent = ev.pet + " · " + type.label;
        cell.appendChild(chip);
        monthEvents.push({ ev: ev, ds: ds });
      });

      // Tapping a day fills the date box in the form
      cell.addEventListener("click", () => { dateInput.value = ds; });
      grid.appendChild(cell);
    }

    // The list underneath (easier to read on a phone)
    if (monthEvents.length === 0) {
      const li = document.createElement("li");
      li.textContent = "No events this month.";
      monthList.appendChild(li);
    }
    monthEvents.forEach(item => {
      const type = TYPES[item.ev.type];
      const li = document.createElement("li");

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = type.color;

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = item.ds.slice(8) + " " + monthLabel.textContent.split(" ")[0] + " · " +
                         item.ev.pet + " · " + type.label;
      if (item.ev.notes) {
        const notes = document.createElement("div");
        notes.className = "notes";
        notes.textContent = item.ev.notes;
        text.appendChild(notes);
      }

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.addEventListener("click", () => deleteEvent(item.ev.id));

      li.append(dot, text, del);
      monthList.appendChild(li);
    });
  }

  function deleteEvent(id) {
    const ev = events.find(e => e.id === id);
    const extra = TYPES[ev.type].yearly ? " This removes it from every year." : "";
    if (!confirm("Delete " + ev.pet + "'s " + TYPES[ev.type].label.toLowerCase() + "?" + extra)) return;
    events = events.filter(e => e.id !== id);
    saveEvents();
    render();
  }

  // 6. Set up the form and legend.
  const legend = document.getElementById("legend");
  Object.keys(TYPES).forEach(key => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = TYPES[key].label;
    typeSelect.appendChild(option);

    const item = document.createElement("span");
    item.style.setProperty("--c", TYPES[key].color);
    item.textContent = TYPES[key].label;
    legend.appendChild(item);
  });

  dateInput.value = todayString();

  document.getElementById("eventForm").addEventListener("submit", e => {
    e.preventDefault();
    const ev = {
      id: Date.now(),
      pet: document.getElementById("pet").value.trim(),
      type: typeSelect.value,
      date: dateInput.value,
      notes: document.getElementById("notes").value.trim()
    };
    events.push(ev);
    saveEvents();

    // Jump to the month of the new event so you can see it
    const [y, m] = ev.date.split("-").map(Number);
    viewDate = new Date(y, m - 1, 1);
    render();

    document.getElementById("pet").value = "";
    document.getElementById("notes").value = "";
  });

  // 7. Month navigation.
  document.getElementById("prev").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    render();
  });
  document.getElementById("next").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    render();
  });
  document.getElementById("today").addEventListener("click", () => {
    viewDate = new Date();
    viewDate.setDate(1);
    render();
  });

  render();
</script>
</body>
</html>
